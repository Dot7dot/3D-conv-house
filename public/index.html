<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>3D 轉換屋</title>
  <meta name="description" content="選擇物件種類、上傳圖片，轉換成可以放進遊戲的 3D 物件（.glb）">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="/vendor/model-viewer.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <div>
        <h1>3D 轉換屋</h1>
        <p>2D 圖片 → 3D 遊戲物件</p>
      </div>
    </div>
  </header>

  <main class="layout">
    <aside class="panel side pick" aria-label="選擇物件">
      <label class="field">
        <span class="eyebrow">ITEMS</span>
        <select id="item"></select>
      </label>

      <div id="manifestState" class="state" hidden></div>

      <div id="details" class="instructions" hidden>
        <p id="description" class="muted"></p>
        <div id="instructions"></div>
        <p class="repo">由 <a id="repoLink" target="_blank" rel="noopener"></a> 轉換</p>
      </div>
    </aside>

    <section class="panel work" aria-label="上傳與預覽">
      <div id="workEmpty" class="empty">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 30V8m0 0-8 8m8-8 8 8M8 26v12h32V26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <p id="workEmptyText">先選擇要轉換的物件</p>
      </div>

      <div id="uploads" class="uploads" hidden></div>

      <div id="result" class="result" hidden>
        <div class="result-head">
          <h2>3D 預覽</h2>
          <span id="resultInfo" class="muted"></span>
        </div>
        <model-viewer id="viewer" camera-controls touch-action="pan-y" auto-rotate auto-rotate-delay="1500"
          shadow-intensity="0.6" exposure="1.05" environment-image="neutral" interaction-prompt="none"
          alt="轉換後的 3D 物件"></model-viewer>
        <div class="result-actions">
          <a id="download" class="btn primary" download>⬇ 下載 .glb</a>
          <span class="muted">拖曳旋轉、滾輪或雙指縮放</span>
        </div>
      </div>
    </section>

    <aside id="settings" class="panel side settings" aria-label="轉換設定" hidden>
      <span class="eyebrow">設定</span>
      <form id="options" class="options" novalidate></form>
      <button id="convert" class="btn primary block" type="button" disabled>開始轉換</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </aside>

  </main>

  <template id="slotTemplate">
    <label class="slot">
      <input type="file" hidden>
      <div class="slot-head">
        <strong class="slot-label"></strong>
        <span class="badge"></span>
      </div>
      <div class="drop">
        <img alt="" hidden>
        <div class="drop-empty">
          <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 30V8m0 0-8 8m8-8 8 8M8 26v12h32V26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>點擊或拖曳圖片到這裡</span>
        </div>
      </div>
      <div class="slot-foot">
        <span class="slot-hint muted"></span>
        <button type="button" class="link remove" hidden>移除</button>
      </div>
    </label>
  </template>

  <script src="app.js"></script>
</body>
</html>
